<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>iQuarters</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;font-family:Arial,sans-serif;color:white}#game{display:block;width:100%;height:100%;touch-action:none}#labels{position:fixed;inset:0;pointer-events:none}#labels>div{position:absolute;display:flex;align-items:center;justify-content:center;white-space:pre-line;font-weight:bold;text-shadow:1px 2px 2px #000}#loading{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));font-size:16px}#start{position:fixed;inset:0;display:grid;place-content:center;background:#000c;text-align:center;gap:20px}button{font:700 22px Arial;color:#102508;background:linear-gradient(#b5f27f,#70c648);border:3px solid white;border-radius:20px;padding:16px 38px;cursor:pointer}#start p{max-width:300px;line-height:1.5;color:#ddd}#safe{position:fixed;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);pointer-events:none;visibility:hidden}
</style></head><body><canvas id="game" aria-label="iQuarters game"></canvas><div id="labels"></div><div id="loading" role="status">Loading...</div><div id="start" hidden style="display:none"><button id="play">Play iQuarters</button><p>Flick upward to throw a quarter.<br>Mouse and touch supported.</p></div><div id="safe"></div><script type="module" src="./main.js"></script></body></html>
